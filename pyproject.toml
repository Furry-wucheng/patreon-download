[project]
name = "patreon-download"
version = "0.1.0"
description = "A Patreon content downloader CLI tool"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
]

[project.scripts]
patreon-dl = "patreon_download.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patreon_download"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
